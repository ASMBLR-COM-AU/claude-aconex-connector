app = "aconex-gateway"
primary_region = "syd"

[env]
  PUBLIC_HOST = "aconex-gateway.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  # Stop the machine when idle to save money; it starts again on the next request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
