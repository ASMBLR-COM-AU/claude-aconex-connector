app = "aconex-gateway"
primary_region = "syd"

[env]
  PUBLIC_HOST = "aconex-gateway.fly.dev"
  AUDIT_DB = "/data/audit.db"
  # Projects the gateway may use, comma-separated Aconex project IDs. Empty
  # means none. Changing it goes through GitHub, so a person approves it.
  ALLOWED_PROJECTS = ""
  # People who may sign in: comma-separated emails, and/or whole domains in
  # ALLOWED_DOMAINS. Empty means nobody. Changes go through GitHub.
  ALLOWED_EMAILS = "lachie@asmblr.com.au"
  ALLOWED_DOMAINS = ""
  # Company sign-in service. Google by default; for Microsoft see docs/runbook.md.
  # SIGNIN_CLIENT_ID and SIGNIN_CLIENT_SECRET are Fly secrets, never in this file.
  SIGNIN_ISSUER = "https://accounts.google.com"

# Encrypted 1 GB volume for the audit log, with daily snapshots kept 5 days.
[mounts]
  source = "gateway_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Stop the machine when idle to save money; it starts again on the next request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
